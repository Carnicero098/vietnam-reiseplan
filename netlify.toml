[build]
  # Nur der Ordner „seite“ ist öffentlich abrufbar. startdaten.mjs (mit
  # Versicherungsnummer) liegt bewusst außerhalb und erreicht nur den Server.
  publish = "seite"
  functions = "funktionen"
  [functions]
  included_files = ["plan.mjs", "startdaten.mjs"]

# Die Seite lädt alles aus dem eigenen Verzeichnis: keine fremden Server,
# keine Schriften von Google, keine Zähldienste.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Sicherheitsnetz: Falls die Funktion ihren Pfad nicht selbst beansprucht,
# landet /api/... trotzdem bei ihr.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = false
